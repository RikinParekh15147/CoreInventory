services:
  # Web application
  - type: web
    name: coreinventory-web
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: coreinventory-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: coreinventory-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DJANGO_SETTINGS_MODULE
        value: "config.settings.production"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: WEB_CONCURRENCY
        value: "2"

  # Celery Worker for background tasks
  - type: worker
    name: coreinventory-worker
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "celery -A config worker -l info -Q default"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: coreinventory-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: coreinventory-redis
          property: connectionString
      - key: SECRET_KEY
        fromService:
          type: web
          name: coreinventory-web
          envVarKey: SECRET_KEY
      - key: DJANGO_SETTINGS_MODULE
        value: "config.settings.production"

  # Celery Beat for scheduled tasks
  - type: worker
    name: coreinventory-beat
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: coreinventory-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: coreinventory-redis
          property: connectionString
      - key: SECRET_KEY
        fromService:
          type: web
          name: coreinventory-web
          envVarKey: SECRET_KEY
      - key: DJANGO_SETTINGS_MODULE
        value: "config.settings.production"

databases:
  # PostgreSQL Database
  - name: coreinventory-db
    databaseName: coreinventory
    user: coreinventory_user

  # Redis instance for Celery
  - type: redis
    name: coreinventory-redis
    plan: free

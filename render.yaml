services:
  # Web application
  - type: web
    name: coreinventory-web
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: core-inventory
          property: connectionString
      - key: REDIS_URL
        value: "rediss://default:gQAAAAAAARewAAIncDE3MTZiMzFlYTkxZjM0ZDRhOTIzZGMyYzllZWM4MTdiNnAxNzE2MDA@endless-ox-71600.upstash.io:6379"
      - key: SECRET_KEY
        generateValue: true
      - key: DJANGO_SETTINGS_MODULE
        value: "config.settings.production"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: WEB_CONCURRENCY
        value: "2"

  # Celery Worker for background tasks
  - type: worker
    name: coreinventory-worker
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "celery -A config worker -l info -Q default"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: core-inventory
          property: connectionString
      - key: REDIS_URL
        value: "rediss://default:gQAAAAAAARewAAIncDE3MTZiMzFlYTkxZjM0ZDRhOTIzZGMyYzllZWM4MTdiNnAxNzE2MDA@endless-ox-71600.upstash.io:6379"
      - key: SECRET_KEY
        fromService:
          type: web
          name: coreinventory-web
          envVarKey: SECRET_KEY
      - key: DJANGO_SETTINGS_MODULE
        value: "config.settings.production"

  # Celery Beat for scheduled tasks
  - type: worker
    name: coreinventory-beat
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: core-inventory
          property: connectionString
      - key: REDIS_URL
        value: "rediss://default:gQAAAAAAARewAAIncDE3MTZiMzFlYTkxZjM0ZDRhOTIzZGMyYzllZWM4MTdiNnAxNzE2MDA@endless-ox-71600.upstash.io:6379"
      - key: SECRET_KEY
        fromService:
          type: web
          name: coreinventory-web
          envVarKey: SECRET_KEY
      - key: DJANGO_SETTINGS_MODULE
        value: "config.settings.production"

databases:
  # PostgreSQL Database
  - name: core-inventory
    databaseName: coredb_5cra
    user: coredbuser



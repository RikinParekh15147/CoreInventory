{% extends "base.html" %}

{% block title %}Verify & Reset — CoreInventory{% endblock %}

{% block auth_content %}
<div class="w-full max-w-md px-6">
    <div class="bg-white/5 backdrop-blur-xl rounded-2xl border border-white/10 p-8 shadow-2xl">
        <!-- Icon -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-14 h-14 bg-blue-600 rounded-xl mb-4">
                <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
                </svg>
            </div>
            <h1 class="text-2xl font-bold text-white">Reset <span class="text-blue-400">Password</span></h1>
            <p class="text-gray-400 text-sm mt-2">Code sent to <span class="text-white">{{ email }}</span></p>
        </div>

        <form method="POST" class="space-y-5">
            {% csrf_token %}
            {% if messages %}
            {% for message in messages %}
                <div class="bg-red-500/10 border border-red-500/20 rounded-lg p-3">
                    <p class="text-red-400 text-sm text-center">{{ message }}</p>
                </div>
            {% endfor %}
            {% endif %}

            <div>
                <label class="block text-sm font-medium text-gray-300 mb-1.5 uppercase tracking-wider text-xs">6-Digit Code</label>
                <input type="text" name="otp_code" required maxlength="6"
                       class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-lg text-white text-center text-2xl tracking-[0.5em] focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all font-mono"
                       placeholder="000000">
            </div>

            <div class="space-y-4 pt-2 border-t border-white/5">
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-1.5">New Password</label>
                    <input type="password" name="new_password" required
                           class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-lg text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all"
                           placeholder="••••••••">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-1.5">Confirm New Password</label>
                    <input type="password" name="confirm_password" required
                           class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-lg text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all"
                           placeholder="••••••••">
                </div>
            </div>

            <button type="submit"
                    class="w-full py-3 px-4 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg transition-all duration-200 transform hover:scale-[1.01]">
                Reset My Password
            </button>
        </form>
    </div>
</div>
{% endblock %}

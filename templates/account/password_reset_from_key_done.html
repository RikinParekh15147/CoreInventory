{% extends "base.html" %}

{% block title %}Password Changed — CoreInventory{% endblock %}

{% block auth_content %}
<div class="w-full max-w-md px-6">
    <div class="bg-white/5 backdrop-blur-xl rounded-2xl border border-white/10 p-8 shadow-2xl text-center">
        <div class="inline-flex items-center justify-center w-14 h-14 bg-green-600 rounded-xl mb-4">
            <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
            </svg>
        </div>
        <h1 class="text-2xl font-bold text-white mb-2">Password <span class="text-green-400">Changed!</span></h1>
        <p class="text-gray-400 text-sm mb-6">
            Your password has been successfully reset. You can now sign in with your new password.
        </p>
        <a href="{% url 'account_login' %}"
           class="inline-block py-3 px-6 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg transition-all duration-200">
            Sign In
        </a>
    </div>
</div>
{% endblock %}

<!-- ═══ AI CHAT SLIDEOUT PANEL ═══ -->
<div x-data="chatPanel()" @toggle-chat.window="toggle()" @keydown.escape.window="open = false"
     class="fixed inset-0 z-50" x-show="open" x-cloak>

    <!-- Backdrop -->
    <div class="absolute inset-0 bg-black/60 backdrop-blur-sm" @click="open = false"
         x-show="open" x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0"
         x-transition:enter-end="opacity-100" x-transition:leave="transition ease-in duration-150"
         x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0"></div>

    <!-- Slide-out Drawer Panel -->
    <div class="fixed inset-y-0 right-0 w-full max-w-md bg-gray-900 shadow-2xl flex flex-col border-l border-gray-700/50 overflow-hidden"
         x-show="open" 
         x-transition:enter="transition ease-out duration-300 transform"
         x-transition:enter-start="translate-x-full" 
         x-transition:enter-end="translate-x-0"
         x-transition:leave="transition ease-in duration-200 transform"
         x-transition:leave-start="translate-x-0" 
         x-transition:leave-end="translate-x-full">

        <!-- Header -->
        <div class="flex items-center justify-between px-5 py-4 border-b border-gray-700/50 bg-gray-900/80 backdrop-blur-sm">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-purple-500 to-pink-500 flex items-center justify-center">
                    <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.813 15.904L9 18.75l-.813-2.846a4.5 4.5 0 00-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 003.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 003.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 00-3.09 3.09z"/></svg>
                </div>
                <div>
                    <h2 class="text-white font-semibold text-sm">CoreInventory AI</h2>
                    <p class="text-gray-400 text-xs">Natural language inventory ops</p>
                </div>
            </div>
            <button @click="open = false" class="text-gray-400 hover:text-white transition-colors p-1 rounded-lg hover:bg-gray-800">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
        </div>

        <!-- Messages Area -->
        <div class="flex-1 overflow-y-auto p-4 space-y-4" id="chat-messages" x-ref="messages">
            <!-- Welcome -->
            <template x-if="messages.length === 0">
                <div class="text-center py-8">
                    <div class="w-16 h-16 mx-auto mb-4 rounded-2xl bg-gradient-to-br from-purple-500/20 to-pink-500/20 flex items-center justify-center">
                        <svg class="w-8 h-8 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9.813 15.904L9 18.75l-.813-2.846a4.5 4.5 0 00-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 003.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 003.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 00-3.09 3.09z"/></svg>
                    </div>
                    <h3 class="text-white font-semibold mb-2">Hey! What can I do for you?</h3>
                    <p class="text-gray-400 text-sm mb-6">Ask me anything about your inventory. I can create receipts, deliveries, transfers, check stock, and more.</p>
                    <div class="space-y-2">
                        <button @click="sendQuick('Show me all low stock items')" class="w-full text-left text-sm px-4 py-2.5 rounded-lg bg-gray-800/50 text-gray-300 hover:bg-gray-800 hover:text-white transition border border-gray-700/50">💡 Show me all low stock items</button>
                        <button @click="sendQuick('How many products do we have?')" class="w-full text-left text-sm px-4 py-2.5 rounded-lg bg-gray-800/50 text-gray-300 hover:bg-gray-800 hover:text-white transition border border-gray-700/50">📊 How many products do we have?</button>
                        <button @click="sendQuick('List all warehouses and their locations')" class="w-full text-left text-sm px-4 py-2.5 rounded-lg bg-gray-800/50 text-gray-300 hover:bg-gray-800 hover:text-white transition border border-gray-700/50">🏭 List all warehouses and locations</button>
                    </div>
                </div>
            </template>

            <!-- Chat Messages -->
            <template x-for="(msg, idx) in messages" :key="idx">
                <div>
                    <!-- User message -->
                    <template x-if="msg.role === 'user'">
                        <div class="flex justify-end">
                            <div class="max-w-[80%] bg-purple-600 text-white px-4 py-2.5 rounded-2xl rounded-br-md text-sm" x-text="msg.content"></div>
                        </div>
                    </template>
                    <!-- AI message -->
                    <template x-if="msg.role === 'ai'">
                        <div class="flex justify-start gap-2">
                            <div class="w-6 h-6 rounded-full bg-gradient-to-br from-purple-500 to-pink-500 flex-shrink-0 flex items-center justify-center mt-1">
                                <svg class="w-3 h-3 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.813 15.904L9 18.75l-.813-2.846a4.5 4.5 0 00-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 003.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 003.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 00-3.09 3.09z"/></svg>
                            </div>
                            <div class="max-w-[85%]">
                                <div class="bg-gray-800 text-gray-200 px-4 py-2.5 rounded-2xl rounded-bl-md text-sm" x-html="msg.content"></div>
                                <!-- Product table -->
                                <template x-if="msg.products && msg.products.length">
                                    <div class="mt-2 bg-gray-800/50 rounded-xl border border-gray-700/50 overflow-hidden">
                                        <table class="w-full text-xs">
                                            <thead><tr class="bg-gray-800 text-gray-400"><th class="px-3 py-2 text-left">Product</th><th class="px-3 py-2 text-right">Stock</th><th class="px-3 py-2 text-center">Status</th></tr></thead>
                                            <tbody>
                                                <template x-for="p in msg.products" :key="p.sku">
                                                    <tr class="border-t border-gray-700/30 text-gray-300">
                                                        <td class="px-3 py-2"><span x-text="p.name" class="font-medium"></span><br><span class="text-gray-500 font-mono" x-text="p.sku"></span></td>
                                                        <td class="px-3 py-2 text-right font-mono" x-text="p.stock"></td>
                                                        <td class="px-3 py-2 text-center"><span :class="p.low_stock ? 'bg-red-500/20 text-red-400' : 'bg-green-500/20 text-green-400'" class="px-2 py-0.5 rounded-full text-[10px] font-medium" x-text="p.low_stock ? 'LOW' : 'OK'"></span></td>
                                                    </tr>
                                                </template>
                                            </tbody>
                                        </table>
                                    </div>
                                </template>
                                <!-- Stock table -->
                                <template x-if="msg.stock && msg.stock.length">
                                    <div class="mt-2 bg-gray-800/50 rounded-xl border border-gray-700/50 overflow-hidden">
                                        <table class="w-full text-xs">
                                            <thead><tr class="bg-gray-800 text-gray-400"><th class="px-3 py-2 text-left">Product</th><th class="px-3 py-2 text-left">Location</th><th class="px-3 py-2 text-right">Qty</th></tr></thead>
                                            <tbody>
                                                <template x-for="s in msg.stock" :key="s.product+s.location">
                                                    <tr class="border-t border-gray-700/30 text-gray-300">
                                                        <td class="px-3 py-2" x-text="s.product"></td>
                                                        <td class="px-3 py-2 text-gray-400" x-text="s.location"></td>
                                                        <td class="px-3 py-2 text-right font-mono" x-text="s.quantity"></td>
                                                    </tr>
                                                </template>
                                            </tbody>
                                        </table>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </template>
                    <!-- Loading -->
                    <template x-if="msg.role === 'loading'">
                        <div class="flex justify-start gap-2">
                            <div class="w-6 h-6 rounded-full bg-gradient-to-br from-purple-500 to-pink-500 flex-shrink-0 flex items-center justify-center mt-1 animate-pulse">
                                <svg class="w-3 h-3 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.813 15.904L9 18.75l-.813-2.846a4.5 4.5 0 00-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 003.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 003.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 00-3.09 3.09z"/></svg>
                            </div>
                            <div class="bg-gray-800 px-4 py-3 rounded-2xl rounded-bl-md">
                                <div class="flex gap-1"><span class="w-2 h-2 bg-purple-400 rounded-full animate-bounce" style="animation-delay:0ms"></span><span class="w-2 h-2 bg-purple-400 rounded-full animate-bounce" style="animation-delay:150ms"></span><span class="w-2 h-2 bg-purple-400 rounded-full animate-bounce" style="animation-delay:300ms"></span></div>
                            </div>
                        </div>
                    </template>
                </div>
            </template>
        </div>

        <!-- Confirmation Modal -->
        <template x-if="pendingAction">
            <div class="absolute inset-0 bg-black/60 backdrop-blur-sm z-10 flex items-end">
                <div class="w-full bg-gray-800 border-t border-gray-700 rounded-t-2xl p-5 max-h-[60%] overflow-y-auto">
                    <div class="flex items-center gap-2 mb-3">
                        <div class="w-8 h-8 rounded-lg bg-amber-500/20 flex items-center justify-center">
                            <svg class="w-4 h-4 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L4.082 16.5c-.77.833.192 2.5 1.732 2.5z"/></svg>
                        </div>
                        <h3 class="text-white font-semibold text-sm">Confirm Action</h3>
                    </div>
                    <div class="bg-gray-900/50 rounded-xl p-4 mb-4 border border-gray-700/50">
                        <p class="text-sm text-gray-300 mb-2 font-medium" x-text="pendingAction.summary"></p>
                        <!-- Dynamic Editable Form -->
                        <div class="mt-3 space-y-3">
                            <!-- create_receipt -->
                            <template x-if="pendingAction.action_type === 'create_receipt'">
                                <div class="space-y-2">
                                    <input list="suppliers-list" x-model="pendingAction.data.supplier_name" placeholder="Supplier Name" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-1.5 text-sm text-white">
                                    <datalist id="suppliers-list">
                                        <template x-for="s in metadata.suppliers" :key="s.id">
                                            <option :value="s.name"></option>
                                        </template>
                                    </datalist>
                                    <select x-model="pendingAction.data.destination_location" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-1.5 text-sm text-white">
                                        <option value="">Select Destination Location</option>
                                        <template x-for="loc in metadata.locations" :key="loc.id">
                                            <option :value="loc.name" x-text="loc.name"></option>
                                        </template>
                                    </select>
                                    <template x-if="pendingAction.data.lines">
                                        <div class="space-y-2">
                                            <template x-for="(line, i) in pendingAction.data.lines" :key="i">
                                                <div class="flex gap-2">
                                                    <select x-model="line.product_name" class="flex-1 bg-gray-900 border border-gray-700 rounded-lg px-3 py-1.5 text-sm text-white">
                                                        <option value="">Select Product</option>
                                                        <template x-for="p in metadata.products" :key="p.id">
                                                            <option :value="p.name" x-text="p.name + ' (' + p.sku + ')'"></option>
                                                        </template>
                                                    </select>
                                                    <input type="number" x-model="line.expected_qty" placeholder="Qty" class="w-24 bg-gray-900 border border-gray-700 rounded-lg px-3 py-1.5 text-sm text-white">
                                                </div>
                                            </template>
                                        </div>
                                    </template>
                                </div>
                            </template>
                            
                            <!-- create_delivery -->
                            <template x-if="pendingAction.action_type === 'create_delivery'">
                                <div class="space-y-2">
                                    <input list="customers-list" x-model="pendingAction.data.customer_name" placeholder="Customer Name" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-1.5 text-sm text-white">
                                    <datalist id="customers-list">
                                        <template x-for="c in metadata.customers" :key="c.id">
                                            <option :value="c.name"></option>
                                        </template>
                                    </datalist>
                                    <select x-model="pendingAction.data.source_location" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-1.5 text-sm text-white">
                                        <option value="">Select Source Location</option>
                                        <template x-for="loc in metadata.locations" :key="loc.id">
                                            <option :value="loc.name" x-text="loc.name"></option>
                                        </template>
                                    </select>
                                    <template x-if="pendingAction.data.lines">
                                        <div class="space-y-2">
                                            <template x-for="(line, i) in pendingAction.data.lines" :key="i">
                                                <div class="flex gap-2">
                                                    <select x-model="line.product_name" class="flex-1 bg-gray-900 border border-gray-700 rounded-lg px-3 py-1.5 text-sm text-white">
                                                        <option value="">Select Product</option>
                                                        <template x-for="p in metadata.products" :key="p.id">
                                                            <option :value="p.name" x-text="p.name + ' (' + p.sku + ')'"></option>
                                                        </template>
                                                    </select>
                                                    <input type="number" x-model="line.requested_qty" placeholder="Qty" class="w-24 bg-gray-900 border border-gray-700 rounded-lg px-3 py-1.5 text-sm text-white">
                                                </div>
                                            </template>
                                        </div>
                                    </template>
                                </div>
                            </template>
                            
                            <!-- create_transfer -->
                            <template x-if="pendingAction.action_type === 'create_transfer'">
                                <div class="space-y-2">
                                    <select x-model="pendingAction.data.from_location" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-1.5 text-sm text-white">
                                        <option value="">Source Location</option>
                                        <template x-for="loc in metadata.locations" :key="loc.id">
                                            <option :value="loc.name" x-text="loc.name"></option>
                                        </template>
                                    </select>
                                    <select x-model="pendingAction.data.to_location" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-1.5 text-sm text-white">
                                        <option value="">Destination Location</option>
                                        <template x-for="loc in metadata.locations" :key="loc.id">
                                            <option :value="loc.name" x-text="loc.name"></option>
                                        </template>
                                    </select>
                                    <template x-if="pendingAction.data.lines">
                                        <div class="space-y-2">
                                            <template x-for="(line, i) in pendingAction.data.lines" :key="i">
                                                <div class="flex gap-2">
                                                    <select x-model="line.product_name" class="flex-1 bg-gray-900 border border-gray-700 rounded-lg px-3 py-1.5 text-sm text-white">
                                                        <option value="">Select Product</option>
                                                        <template x-for="p in metadata.products" :key="p.id">
                                                            <option :value="p.name" x-text="p.name + ' (' + p.sku + ')'"></option>
                                                        </template>
                                                    </select>
                                                    <input type="number" x-model="line.qty" placeholder="Qty" class="w-24 bg-gray-900 border border-gray-700 rounded-lg px-3 py-1.5 text-sm text-white">
                                                </div>
                                            </template>
                                        </div>
                                    </template>
                                </div>
                            </template>
                            
                            <!-- create_adjustment -->
                            <template x-if="pendingAction.action_type === 'create_adjustment'">
                                <div class="space-y-2">
                                    <select x-model="pendingAction.data.location" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-1.5 text-sm text-white">
                                        <option value="">Select Location</option>
                                        <template x-for="loc in metadata.locations" :key="loc.id">
                                            <option :value="loc.name" x-text="loc.name"></option>
                                        </template>
                                    </select>
                                    <select x-model="pendingAction.data.reason" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-1.5 text-sm text-white">
                                        <option value="count_correction">Count Correction</option>
                                        <option value="damage">Damage</option>
                                        <option value="theft">Theft</option>
                                        <option value="expiry">Expiry</option>
                                        <option value="other">Other</option>
                                    </select>
                                    <template x-if="pendingAction.data.lines">
                                        <div class="space-y-2">
                                            <template x-for="(line, i) in pendingAction.data.lines" :key="i">
                                                <div class="flex gap-2">
                                                    <select x-model="line.product_name" class="flex-1 bg-gray-900 border border-gray-700 rounded-lg px-3 py-1.5 text-sm text-white">
                                                        <option value="">Select Product</option>
                                                        <template x-for="p in metadata.products" :key="p.id">
                                                            <option :value="p.name" x-text="p.name + ' (' + p.sku + ')'"></option>
                                                        </template>
                                                    </select>
                                                    <input type="number" x-model="line.actual_qty" placeholder="Actual Qty" class="w-24 bg-gray-900 border border-gray-700 rounded-lg px-3 py-1.5 text-sm text-white">
                                                </div>
                                            </template>
                                        </div>
                                    </template>
                                </div>
                            </template>
                            
                            <!-- fallback for other mutations -->
                            <template x-if="!['create_receipt', 'create_delivery', 'create_transfer', 'create_adjustment'].includes(pendingAction.action_type)">
                                <div class="text-xs text-gray-500 font-mono bg-gray-900 rounded-lg p-3 max-h-32 overflow-y-auto">
                                    <pre x-text="JSON.stringify(pendingAction.data, null, 2)" class="whitespace-pre-wrap"></pre>
                                </div>
                            </template>
                        </div>
                    </div>
                    <div class="flex gap-3">
                        <button @click="rejectAction()" class="flex-1 px-4 py-2.5 rounded-xl bg-gray-700 text-gray-300 hover:bg-gray-600 transition text-sm font-medium">Cancel</button>
                        <button @click="confirmAction()" class="flex-1 px-4 py-2.5 rounded-xl bg-gradient-to-r from-purple-600 to-pink-600 text-white hover:from-purple-500 hover:to-pink-500 transition text-sm font-medium">🚀 Proceed</button>
                    </div>
                </div>
            </div>
        </template>

        <!-- Input Area -->
        <div class="px-4 py-3 border-t border-gray-700/50 bg-gray-900/80 backdrop-blur-sm">
            <form @submit.prevent="send()" class="flex gap-2">
                <input x-model="input" x-ref="chatInput" type="text" placeholder="Ask anything... e.g. 'Create a receipt for 50 widgets'"
                       class="flex-1 bg-gray-800 text-white text-sm rounded-xl px-4 py-2.5 border border-gray-700 focus:border-purple-500 focus:ring-1 focus:ring-purple-500 outline-none placeholder-gray-500 transition"
                       :disabled="loading" autocomplete="off" id="chat-input">
                <button type="submit" :disabled="loading || !input.trim()"
                        class="px-4 py-2.5 rounded-xl bg-gradient-to-r from-purple-600 to-pink-600 text-white text-sm font-medium hover:from-purple-500 hover:to-pink-500 disabled:opacity-40 disabled:cursor-not-allowed transition flex items-center gap-1.5">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 12L3.269 3.126A59.768 59.768 0 0121.485 12 59.77 59.77 0 013.27 20.876L5.999 12zm0 0h7.5"/></svg>
                    Send
                </button>
            </form>
        </div>
    </div>
</div>

<script>
function chatPanel() {
    return {
        open: false,
        input: '',
        loading: false,
        messages: [],
        pendingAction: null,
        metadata: { products: [], locations: [], suppliers: [], customers: [] },
        csrfToken: '{{ csrf_token }}',

        toggle() {
            this.open = !this.open;
            if (this.open) {
                this.$nextTick(() => this.$refs.chatInput?.focus());
                this.fetchMetadata();
            }
        },

        async fetchMetadata() {
            if (this.metadata.products.length > 0) return;
            try {
                const res = await fetch('/chat/metadata/');
                const data = await res.json();
                this.metadata = data;
            } catch (err) {
                console.error('Failed to fetch chat metadata', err);
            }
        },

        scrollBottom() {
            this.$nextTick(() => {
                const el = this.$refs.messages;
                if (el) el.scrollTop = el.scrollHeight;
            });
        },

        sendQuick(text) {
            this.input = text;
            this.send();
        },

        async send() {
            const prompt = this.input.trim();
            if (!prompt || this.loading) return;
            this.input = '';
            
            // Gather history before appending new ones
            const history = this.messages.filter(m => m.role !== 'loading').map(m => ({
                role: m.role,
                content: m.content
            }));
            
            this.messages.push({ role: 'user', content: prompt });
            this.messages.push({ role: 'loading', content: '' });
            this.loading = true;
            this.scrollBottom();

            try {
                const res = await fetch('/chat/send/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-CSRFToken': this.csrfToken },
                    body: JSON.stringify({ prompt, history })
                });
                const data = await res.json();
                // Remove loading
                this.messages = this.messages.filter(m => m.role !== 'loading');

                if (data.error) {
                    this.messages.push({ role: 'ai', content: '❌ ' + data.error });
                } else if (data.executed) {
                    // Query result — auto-executed
                    const r = data.result;
                    const msg = { role: 'ai', content: r.message || data.action.summary };
                    if (r.products) msg.products = r.products;
                    if (r.stock) msg.stock = r.stock;
                    this.messages.push(msg);
                    
                    // Display questions if it's request_info
                    if (data.action.action_type === 'request_info') {
                        this.messages.push({ role: 'ai', content: '🤔 ' + data.action.summary });
                    }
                } else {
                    // Needs confirmation for mutation actions
                    this.messages.push({ role: 'ai', content: '⚡ ' + data.action.summary + '<br><span class="text-purple-400 text-xs">Awaiting your confirmation below...</span>' });
                    this.pendingAction = data.action;
                }

            } catch (err) {
                this.messages = this.messages.filter(m => m.role !== 'loading');
                this.messages.push({ role: 'ai', content: '❌ Network error. Please try again.' });
            }
            this.loading = false;
            this.scrollBottom();
        },

        async confirmAction() {
            if (!this.pendingAction) return;
            const action = this.pendingAction;
            this.pendingAction = null;
            this.messages.push({ role: 'loading', content: '' });
            this.loading = true;
            this.scrollBottom();

            try {
                const res = await fetch('/chat/execute/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-CSRFToken': this.csrfToken },
                    body: JSON.stringify({ action })
                });
                const data = await res.json();
                this.messages = this.messages.filter(m => m.role !== 'loading');
                const r = data.result;
                if (r.success) {
                    this.messages.push({ role: 'ai', content: '✅ ' + r.message });
                } else {
                    this.messages.push({ role: 'ai', content: '❌ ' + r.message });
                }
            } catch (err) {
                this.messages = this.messages.filter(m => m.role !== 'loading');
                this.messages.push({ role: 'ai', content: '❌ Failed to execute. Please try again.' });
            }
            this.loading = false;
            this.scrollBottom();
        },

        rejectAction() {
            this.pendingAction = null;
            this.messages.push({ role: 'ai', content: '🚫 Action cancelled. No changes were made.' });
            this.scrollBottom();
        }
    };
}
</script>
